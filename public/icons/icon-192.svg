<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#f99A1D"/>
  <g transform="translate(96,100)" fill="none">
    <!-- Hard hat dome -->
    <path d="M-52,0 C-52,-38 -32,-62 0,-62 C32,-62 52,-38 52,0" 
          fill="#193153"/>
    <!-- Hat brim -->
    <rect x="-62" y="-2" width="124" height="14" rx="7" fill="#193153"/>
    <!-- Center ridge line -->
    <rect x="-4" y="-58" width="8" height="52" rx="4" fill="#f99A1D" fill-opacity="0.5"/>
    <!-- Headband -->
    <rect x="-48" y="12" width="96" height="12" rx="4" fill="#193153"/>
    <!-- Inner suspension lines -->
    <path d="M-36,14 L-28,-20 M36,14 L28,-20 M0,14 L0,-10" 
          stroke="#f99A1D" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
