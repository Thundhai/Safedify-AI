name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ---------- Frontend ----------
      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # ---------- Server ----------
      - name: Install server dependencies
        run: cd server && npm ci

      - name: TypeScript check (server)
        run: cd server && npx tsc --noEmit

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t safedify-ai:ci .
