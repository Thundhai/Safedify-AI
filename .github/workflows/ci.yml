name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env:
          POSTGRES_USER: safedify_user
          POSTGRES_PASSWORD: safedify_pass
          POSTGRES_DB: safedify
        options: >-
          --health-cmd="pg_isready -U safedify_user -d safedify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: safedify_user
      PGPASSWORD: safedify_pass
      PGDATABASE: safedify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: Install server dependencies
        run: cd server && npm ci

      - name: TypeScript check (server)
        run: cd server && npx tsc --noEmit

  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env:
          POSTGRES_USER: safedify_user
          POSTGRES_PASSWORD: safedify_pass
          POSTGRES_DB: safedify
        options: >-
          --health-cmd="pg_isready -U safedify_user -d safedify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: safedify_user
      PGPASSWORD: safedify_pass
      PGDATABASE: safedify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env:
          POSTGRES_USER: safedify_user
          POSTGRES_PASSWORD: safedify_pass
          POSTGRES_DB: safedify
        options: >-
          --health-cmd="pg_isready -U safedify_user -d safedify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: safedify_user
      PGPASSWORD: safedify_pass
      PGDATABASE: safedify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env:
          POSTGRES_USER: safedify_user
          POSTGRES_PASSWORD: safedify_pass
          POSTGRES_DB: safedify
        options: >-
          --health-cmd="pg_isready -U safedify_user -d safedify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: safedify_user
      PGPASSWORD: safedify_pass
      PGDATABASE: safedify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize PostgreSQL schema
        run: psql -h localhost -U safedify_user -d safedify -f server/postgres-schema.sql
        env:
          PGPASSWORD: safedify_pass

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t safedify-ai:ci .
