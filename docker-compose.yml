services:
  safedify:
    build:
      context: .
    container_name: safedify-ai
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=safedify_user
      - PG_PASSWORD=safedify_pass
      - PG_DATABASE=safedify
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@safedify.com}
      - APP_URL=${APP_URL:-http://localhost:4000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-false}
      - DATA_DIR=/data
    volumes:
      - safedify-data:/data
      - ./:/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15
    container_name: safedify-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=safedify
      - POSTGRES_USER=safedify_user
      - POSTGRES_PASSWORD=safedify_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/postgres-schema.sql:/docker-entrypoint-initdb.d/postgres-schema.sql:ro

volumes:
  safedify-data:
    driver: local
  postgres-data:
    driver: local
