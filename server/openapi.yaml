openapi: '3.1.0'
info:
  title: Safedify AI — HSE Management Platform API
  version: '2.0.0'
  description: |
    REST API for the Safedify AI Health, Safety & Environment management platform.
    All authenticated endpoints require `Authorization: Bearer <token>` header.
    
    ## Changelog
    - **v2.0.0** — Phase 5: Notification preferences, bulk ops, 2FA, profile update, password change, environmental data, admin routes
    - **v1.0.0** — Initial release: Auth, CRUD, search, export, agent, uploads, notifications
  contact:
    name: Safedify AI
    url: https://github.com/Thundhai/Safedify-AI

servers:
  - url: /api
    description: Default (same-origin in production, proxied in dev)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        tier: { type: string }
        avatar: { type: string }

    Incident:
      type: object
      required: [description, date, type, severity]
      properties:
        id: { type: string }
        description: { type: string }
        location: { type: string }
        date: { type: string, format: date-time }
        type: { type: string, enum: [LTI, Near Miss, Fire, Chemical Spill, Vehicle Incident, Slip Trip Fall, Electrical, Confined Space, Working at Height, Environmental] }
        category: { type: string, enum: [Near Miss, First Aid Case, Medical Treatment Case, Restricted Work Case, Lost Time Injury, Fatality] }
        severity: { type: string, enum: [Low, Medium, High, Critical] }
        status: { type: string, enum: [Open, Investigating, Closed] }
        images: { type: array, items: { type: string } }
        days_lost: { type: integer }

    Observation:
      type: object
      required: [type, description, date]
      properties:
        id: { type: string }
        type: { type: string }
        category: { type: string }
        description: { type: string }
        location: { type: string }
        date: { type: string, format: date }
        status: { type: string }

    Action:
      type: object
      required: [title, priority, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        assignee: { type: string }
        due_date: { type: string, format: date }
        priority: { type: string, enum: [Low, Medium, High, Critical] }
        status: { type: string, enum: [Open, In Progress, Overdue, Done, Verified] }
        action_type: { type: string, enum: [Corrective, Preventive, Improvement] }

    Permit:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        location: { type: string }
        description: { type: string }
        valid_from: { type: string, format: date }
        valid_until: { type: string, format: date }
        status: { type: string }

    SearchResult:
      type: object
      properties:
        query: { type: string }
        total: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              title: { type: string }
              snippet: { type: string }
              rank: { type: number }

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
                  environment: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: JWT token and user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials

  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [Worker, HSE Supervisor] }
      responses:
        '201':
          description: Account created
        '409':
          description: Email already registered

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }

  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents (paginated)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list
          headers:
            X-Total-Count: { schema: { type: integer } }
            X-Page: { schema: { type: integer } }
            X-Per-Page: { schema: { type: integer } }
            X-Total-Pages: { schema: { type: integer } }
    post:
      tags: [Incidents]
      summary: Create incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Incident' }
      responses:
        '201':
          description: Created

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get incident by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Incident detail }
        '404': { description: Not found }
    put:
      tags: [Incidents]
      summary: Update incident
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Incidents]
      summary: Delete incident
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }

  /observations:
    get:
      tags: [Observations]
      summary: List observations (paginated)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Paginated list }
    post:
      tags: [Observations]
      summary: Create observation
      responses:
        '201': { description: Created }

  /actions:
    get:
      tags: [Actions]
      summary: List actions (paginated)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Paginated list }
    post:
      tags: [Actions]
      summary: Create action
      responses:
        '201': { description: Created }

  /permits:
    get:
      tags: [Permits]
      summary: List permits (paginated)
      responses:
        '200': { description: Paginated list }
    post:
      tags: [Permits]
      summary: Create permit
      responses:
        '201': { description: Created }

  /workers:
    get:
      tags: [Workers]
      summary: List workers (paginated)
      responses:
        '200': { description: Paginated list }
    post:
      tags: [Workers]
      summary: Create worker
      responses:
        '201': { description: Created }

  /search:
    get:
      tags: [Search]
      summary: Full-text search across all entities
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Search query
        - name: type
          in: query
          schema: { type: string }
          description: Comma-separated entity types to search (incidents,observations,actions,permits,documents)
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }

  /export/{entity}:
    get:
      tags: [Export]
      summary: Export data as CSV or JSON
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [incidents, observations, actions, inspections, permits, workers, contractors, assets, risk-assessments, training]
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Exported data file

  /agent/chat:
    post:
      tags: [AI Agent]
      summary: Chat with AI HSE agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                conversationId: { type: string }
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  conversationId: { type: string }
        '429':
          description: Rate limit exceeded

  /uploads:
    post:
      tags: [Uploads]
      summary: Upload file (base64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: string, description: 'Base64 data URI' }
                files: { type: array, items: { type: string }, description: 'Multiple base64 URIs' }
      responses:
        '201':
          description: Upload result
  /uploads/{filename}:
    get:
      tags: [Uploads]
      summary: Serve uploaded file
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: File content }
        '404': { description: Not found }

  /audit-logs:
    get:
      tags: [Admin]
      summary: List audit logs (Admin only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          schema: { type: string }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Paginated audit logs }

  /admin/backup:
    post:
      tags: [Admin]
      summary: Trigger manual backup (Admin only)
      responses:
        '200': { description: Backup created }

  /admin/backups:
    get:
      tags: [Admin]
      summary: List available backups (Admin only)
      responses:
        '200':
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    size: { type: integer }
                    created: { type: string, format: date-time }

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      responses:
        '200': { description: Notification list }

  /notifications/unread:
    get:
      tags: [Notifications]
      summary: Get unread count
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Marked as read }

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      responses:
        '200':
          description: User notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_incidents: { type: boolean }
                  email_permits: { type: boolean }
                  email_actions: { type: boolean }
                  email_training: { type: boolean }
                  email_observations: { type: boolean }
                  email_digest: { type: boolean }
                  in_app_all: { type: boolean }
    put:
      tags: [Notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_incidents: { type: boolean }
                email_permits: { type: boolean }
                email_actions: { type: boolean }
                email_training: { type: boolean }
                email_observations: { type: boolean }
                email_digest: { type: boolean }
                in_app_all: { type: boolean }
      responses:
        '200': { description: Preferences updated }

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update user profile (name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
      responses:
        '200': { description: Profile updated }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '401': { description: Current password incorrect }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Reset email sent (if account exists) }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password reset successful }

  /2fa/setup:
    post:
      tags: [Two-Factor Auth]
      summary: Generate 2FA setup (QR code / secret)
      responses:
        '200':
          description: TOTP setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qrCodeUrl: { type: string }

  /2fa/verify:
    post:
      tags: [Two-Factor Auth]
      summary: Verify and enable 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: 2FA enabled }
        '400': { description: Invalid token }

  /2fa/disable:
    post:
      tags: [Two-Factor Auth]
      summary: Disable 2FA
      responses:
        '200': { description: 2FA disabled }

  /bulk/delete:
    post:
      tags: [Bulk Operations]
      summary: Bulk delete records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, ids]
              properties:
                entity: { type: string, enum: [incidents, observations, actions] }
                ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }

  /bulk/status:
    post:
      tags: [Bulk Operations]
      summary: Bulk update status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, ids, status]
              properties:
                entity: { type: string, enum: [incidents, observations, actions] }
                ids: { type: array, items: { type: string } }
                status: { type: string }
      responses:
        '200':
          description: Bulk status update result

  /bulk/export:
    post:
      tags: [Bulk Operations]
      summary: Bulk export selected records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, ids]
              properties:
                entity: { type: string }
                ids: { type: array, items: { type: string } }
                format: { type: string, enum: [csv, json], default: csv }
      responses:
        '200': { description: Exported data }

  /environmental:
    get:
      tags: [Environmental]
      summary: List environmental data logs (paginated)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Paginated environmental logs }
    post:
      tags: [Environmental]
      summary: Create environmental data log
      responses:
        '201': { description: Created }

  /environmental/weather:
    get:
      tags: [Environmental]
      summary: Get current weather data
      parameters:
        - name: lat
          in: query
          schema: { type: number }
        - name: lon
          in: query
          schema: { type: number }
      responses:
        '200': { description: Weather data }

  /ai/summarize:
    post:
      tags: [AI]
      summary: AI-powered text summarization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200':
          description: Summary result

  /ai/risk-predict:
    post:
      tags: [AI]
      summary: AI risk prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: object }
      responses:
        '200': { description: Prediction result }
